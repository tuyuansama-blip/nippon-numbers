# Pinned closure of requirements.txt, frozen from the environment that ran the
# J1 confirmation run and every test in this repository (Python 3.14.5, macOS
# arm64). GitHub Actions installs from *this* file, not from requirements.txt.
#
# Why pin at all: docs/DESIGN_SITE.md 3.2-L1 makes GitHub Actions the third-
# party witness that a prediction existed before kickoff, and 3.4 step 5 asks
# a reader to reproduce the backtest themselves. Both claims weaken if the
# numbers depend on whichever numpy/scipy happened to be newest on the day.
# `requirements.txt` stays the loose, human-facing dependency list; this file
# is the reproducible one.
#
# Regenerate with:  ./.venv/bin/pip freeze | grep -v '^pyflakes'
